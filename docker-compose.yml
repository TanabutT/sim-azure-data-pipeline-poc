version: '3.8'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: poc-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    networks:
      - poc-network

  spark:
    build:
      context: services/databricks
      dockerfile: Dockerfile
    container_name: poc-spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./services/databricks/notebooks:/home/jovyan/work
      - spark_warehouse:/home/jovyan/spark_warehouse
      - ./data:/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - AZURE_STORAGE_ACCOUNT=${AZURE_STORAGE_ACCOUNT:-devstoreaccount1}
      - AZURE_STORAGE_KEY=${AZURE_STORAGE_KEY:-sharedsecretkey1}
      - AZURITE_ENDPOINT=${AZURITE_ENDPOINT:-http://azurite:10000}
      - SPARK_LOCAL_IP=spark
    depends_on:
      - azurite
    networks:
      - poc-network
    healthcheck:
      test: curl -f http://localhost:8888/api || exit 1
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  azurite_data:
  spark_warehouse:

networks:
  poc-network:
    driver: bridge
